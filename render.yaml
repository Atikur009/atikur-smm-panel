services:
  - type: web
    name: atikur-smm-panel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: BKASH_NUMBER
        value: "01723502619"
      - key: ADMIN_USERNAME
        value: atikur
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atikur-smm-panel-db
          property: connectionString
      - key: PROVIDER_API_URL
        value: ""
      - key: PROVIDER_API_KEY
        sync: false

databases:
  - name: atikur-smm-panel-db
    plan: free
    databaseName: smmpanel
    user: smmpanel
