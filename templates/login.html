{% extends "base.html" %}
{% block title %}Login · Atikur SMM Panel{% endblock %}
{% block content %}
<div class="formbox">
  <h2>Login</h2>
  <form method="post">
    <label>Username<input name="username" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn big" type="submit">Login</button>
  </form>
  <p>No account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>
{% endblock %}
