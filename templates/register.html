{% extends "base.html" %}
{% block title %}Sign Up · Atikur SMM Panel{% endblock %}
{% block content %}
<div class="formbox">
  <h2>Create Account</h2>
  <form method="post">
    <label>Username<input name="username" required minlength="3"></label>
    <label>Password<input type="password" name="password" required minlength="4"></label>
    <button class="btn big" type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
